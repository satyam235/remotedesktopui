[package]
name = "secops-endpoint-ui"
version = "0.1.0"
edition = "2021"
description = "End-user GUI for SecOps Solution remote desktop feature"
license = "Proprietary"

[dependencies]
eframe = { version = "0.27", default-features = true }
egui = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
