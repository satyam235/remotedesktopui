name: Build SecOps Endpoint UI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: secops-endpoint-ui.exe
            artifact: SecOpsWindowsRemoteDesktopNotifier.exe

          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: secops-endpoint-ui
            artifact: SecOpsLinuxRemoteDesktopNotifierLinuxAmd64

          # Linux ARM64 — native ARM runner avoids cross-compilation of GTK/xcb
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: secops-endpoint-ui
            artifact: SecOpsLinuxRemoteDesktopNotifierLinuxArm64

          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: secops-endpoint-ui
            artifact: SecOpsMacRemoteDesktopNotifierMacArm64

          # macOS x86_64 — cross-compile from ARM runner; Apple frameworks are universal
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: secops-endpoint-ui
            artifact: SecOpsMacRemoteDesktopNotifierMacAmd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      # egui/eframe on Linux needs X11 + Wayland headers and GTK (for file dialogs).
      # The same package list works on both amd64 and arm64 Ubuntu runners.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libssl-dev \
            libglib2.0-dev \
            libdbus-1-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Copy and rename binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.artifact }}

      - name: Copy and rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary }}" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30

  # Publish a GitHub Release with all binaries when a version tag is pushed.
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
